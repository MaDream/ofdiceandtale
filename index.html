<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17191e">
  <meta name="description" content="Of Dice and Tale — ассеты, системы, модули и компендиумы для ваших историй за игровым столом.">
  <title>Of Dice and Tale</title>
  <link rel="icon" type="image/png" href="assets/logo.png">
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <a class="skip" href="#catalog">К каталогу / Skip to catalogue</a>
  <header class="masthead">
    <a class="brand" href="./" aria-label="Of Dice and Tale">
      <img src="assets/logo.png" width="84" height="84" alt="">
      <div><em class="tagline" data-i18n="eyebrow">Для авторов историй, которые еще предстоит рассказать.</em><h1>Of Dice <i>&</i> Tale</h1></div>
    </a>
    <div class="header-tools">
      <div class="languages" role="group" aria-label="Язык / Language"><button type="button" data-lang="ru">RU</button><span aria-hidden="true">/</span><button type="button" data-lang="en">EN</button></div>
    </div>
  </header>
  <main id="catalog" tabindex="-1" aria-busy="true"><p class="loading" role="status" data-i18n="loading">Открываем библиотеку…</p></main>
  <footer><span id="updated" aria-live="polite"></span></footer>
  <aside id="preview" class="preview" hidden aria-label="Описание / Description">
    <button class="preview-close" type="button" aria-label="Закрыть / Close">×</button>
    <a class="preview-image-link" target="_blank" rel="noopener noreferrer"><img class="preview-image" alt=""></a>
    <div class="preview-copy"><span class="preview-category eyebrow"></span><h2></h2><div class="preview-description"></div><a class="preview-link" target="_blank" rel="noopener noreferrer"></a></div>
  </aside>
  <noscript><p class="noscript">Для каталога включите JavaScript. / Enable JavaScript to view the catalogue.</p></noscript>
</body>
</html>
