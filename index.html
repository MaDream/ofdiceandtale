<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#171923">
  <title>Of Dice and Tale</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 32px 24px;
      color: #f2e9dc;
      background: radial-gradient(ellipse at 50% 20%, #303042, #171923 75%);
      font-family: Georgia, "Times New Roman", serif;
    }
    main { width: min(100%, 760px); text-align: center; }
    .mark { color: #d4b785; font-size: 56px; line-height: 1; }
    h1 { margin: 28px 0; font-size: clamp(30px, 7vw, 56px); font-weight: 400; }
    p { margin: 0 auto; max-width: 580px; font-size: clamp(18px, 3vw, 24px); line-height: 1.7; color: #d4cbbc; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">⚄</div>
    <h1>Of Dice and Tale</h1>
    <p>Когда-нибудь возможно здесь будет сайт, посвещенный НРИ, но не сегодня..</p>
  </main>
</body>
</html>
